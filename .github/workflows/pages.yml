name: 台灣外送優惠券 GitHub Pages 部署

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: 下載專案
        uses: actions/checkout@v4
      - name: 更新優惠券快取
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/fetch-coupons.mjs
      - name: 提交排程快取
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/coupons.json
          if git diff --cached --quiet; then
            echo "優惠券內容沒有變更，不建立提交"
          else
            git commit -m "V1.01：更新優惠券排程快取"
            git push
          fi
      - name: 建置靜態頁面
        run: node scripts/build-pages.mjs
      - name: 啟用 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 上傳 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: 發布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
